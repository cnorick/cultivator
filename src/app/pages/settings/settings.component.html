<h1>Settings</h1>
<div class="section">
  <h2>Core</h2>
  <form [formGroup]="settingsForm">
    <mat-form-field>
      <mat-label>Google Sheet ID</mat-label>
      <input matInput type="url" readonly formControlName="spreadsheetId" />
      <a href="/google-picker.html" matSuffix mat-icon-button aria-label="">
        <mat-icon>open_in_new</mat-icon>
      </a>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Transactions Per Page</mat-label>
      <input matInput type="number" formControlName="initialTransactionsLoaded" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Refresh Rate (seconds)</mat-label>
      <input matInput type="number" formControlName="refreshRateSeconds" />
    </mat-form-field>
  </form>
</div>

<mat-divider></mat-divider>

<div *ngIf="showFeatures$ | async" class="section">
  <h2>Features</h2>

  <div class="features-container">
    <mat-card *ngFor="let feature of features" class="feature-card">
      <mat-card-header>
        <mat-card-title>{{feature.name}}</mat-card-title>
        <mat-card-subtitle *ngIf="feature.enabled$ | async">
          <div style="color: green">enabled</div>
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>{{feature.description}}</mat-card-content>
      <mat-card-actions
        *ngIf="(feature.enabled$ | async) && !!feature.disable || (feature.enabled$ | async) === false && !!feature.enable">
        <button mat-button *ngIf="(feature.enabled$ | async) === false && !!feature.enable" color="accent"
          (click)="feature.enable()">Enable</button>
        <button mat-button *ngIf="(feature.enabled$ | async) && !!feature.disable" color="warn"
          (click)="feature.disable()">Disable</button>
      </mat-card-actions>
      <mat-card-footer *ngIf="(feature.enabled$ | async) === null">
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      </mat-card-footer>
    </mat-card>
  </div>
</div>
