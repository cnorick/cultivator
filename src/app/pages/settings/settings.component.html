<form [formGroup]="settingsForm">
  <mat-form-field>
    <mat-label>Google Sheet Url</mat-label>
    <input matInput type="url" formControlName="spreadsheetUrl" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Transactions Per Page</mat-label>
    <input matInput type="number" formControlName="initialTransactionsLoaded" />
  </mat-form-field>
</form>
