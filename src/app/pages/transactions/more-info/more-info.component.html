<ng-container *ngIf="transaction$ | async as t else spinner">
  <div class="header-container">
    <h2>{{t.amount | currency}}</h2>
    <b class="description">{{t.description}}</b>
    <span>{{t.date | date: 'fullDate'}}</span>
    <span>{{t.institution}}</span>
  </div>

  <router-outlet></router-outlet>

</ng-container>
<ng-template #spinner>
  Loading Transaction...
  <mat-spinner></mat-spinner>
</ng-template>
