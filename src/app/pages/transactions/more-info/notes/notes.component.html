<div class="container" *ngIf="(transaction$ | async) as t">
  <mat-form-field>
    <mat-label>Notes:</mat-label>
    <textarea matInput type="textarea" [value]="notesString$ | async" (change)="onNotesChange($event, t);"
      (keydown.enter)="$event.preventDefault(); onNotesChange($event, t);" #input></textarea>
  </mat-form-field>
  <button mat-button routerLink="..">Back</button>
</div>
