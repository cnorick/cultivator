<mat-toolbar>
  <mat-chip-listbox aria-label="Filter selection" multiple>
    <mat-chip-option *ngFor="let filter of allFilters" [value]="filter" [selected]="filter.selected"
      (selectionChange)="onFilterChange($event, filter, allFilters)">
      {{filter.name}}</mat-chip-option>
  </mat-chip-listbox>
</mat-toolbar>
<ng-container *ngIf="transactions$ | async as transactions; else spinner">
  <app-transaction [transaction]="t" *ngFor="let t of transactions"></app-transaction>
</ng-container>

<ng-template #spinner>
  Loading Transactions...
  <mat-spinner></mat-spinner>
</ng-template>
