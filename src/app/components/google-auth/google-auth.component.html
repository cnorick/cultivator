<h1>Log in to Google Sheets</h1>

<p>
  Click this button to be redirected to Google. Log into the Google account that has access to your Tiller Sheet. After
  you log in, you can select the sheet that contains your tiller transactions.
</p>

<div class="button-container">
  <button mat-flat-button color="primary" id="authorize_button" (click)="handleAuthClick()">Authorize</button>
</div>
