<div class="breadcrumb">
  <ng-container *ngFor="let breadcrumb of breadcrumbs$ | async; last as isLast">
    <a class="crumb" [routerLink]="breadcrumb.url" routerLinkActive="router-link-active">
      {{ breadcrumb.label }}
    </a>
    <span *ngIf="!isLast" class="arrow">
      <mat-icon>chevron_right</mat-icon>
    </span>
  </ng-container>
</div>
